[project]
name = "autoedit-pro"
version = "0.1.0"
description = "Free, local-first AI video editing automation with learning capabilities"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Rishi Sakhija", email = "rishi@example.com"}
]
maintainers = [
    {name = "Rishi Sakhija", email = "rishi@example.com"}
]
keywords = [
    "video-editing", "ai", "automation", "davinci-resolve", "whisper",
    "llm", "computer-vision", "content-creation", "youtube"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Content Creators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Core
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "rich>=13.7",
    "typer>=0.12",
    "python-dotenv>=1.0",
    # Async & HTTP
    "httpx>=0.27",
    "tenacity>=8.3",
    # Data & ML
    "numpy>=1.26",
    "scipy>=1.13",
    "librosa>=0.11",
    "madmom>=0.16",
    "onnxruntime>=1.19",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "sqlite-vec>=0.1.6",
    # Video/Audio
    "ffmpeg-python>=0.2",
    "opencv-python>=4.10",
    "ultralytics>=8.2",
    # DaVinci Resolve scripting (optional, checked at runtime)
    # "davinci-resolve-scripting" - not on PyPI, installed via DaVinci
    # UI
    "streamlit>=1.37",
    "st-frame>=0.1",
    # Utilities
    "tqdm>=4.66",
    "orjson>=3.10",
    "jsonschema>=4.22",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "ruff>=0.5",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "pytest-benchmark>=4.0",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=1.3",
]
gpu = [
    "onnxruntime-gpu>=1.19",
    "torch>=2.4",
]
all = [
    "autoedit-pro[dev,docs,gpu]"
]

[project.urls]
Homepage = "https://github.com/RishiSakhija/Editing-System-"
Repository = "https://github.com/RishiSakhija/Editing-System-.git"
Issues = "https://github.com/RishiSakhija/Editing-System-/issues"
Discussions = "https://github.com/RishiSakhija/Editing-System-/discussions"
Documentation = "https://rishisakhija.github.io/Editing-System-/"

[tool.uv]
dev-dependencies = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.11",
    "pre-commit>=3.7",
]

[tool.uv.sources]
# For local development
autoedit-pro = {path = ".", editable = true}

[build-system]
requires = ["hatchling>=1.22"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autoedit"]

[tool.ruff]
target-version = "py311"
line-length = 100
indent-style = "space"
indent-width = 4
quote-style = "double"
docstring-code-format = true
docstring-code-line-length = 88
respect-docstring-whitespace = true

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "T10", # flake8-debugger
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "PD",  # pandas-vet
    "PL",  # pylint
    "TRY", # tryceratops
    "RUF", # ruff-specific
]
ignore = [
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",  # missing docstrings
    "ARG001", "ARG002",  # unused arguments
    "PTH118", "PTH120",  # os.path usage
    "TRY003",  # bare except
]
per-file-ignores = {
    "tests/*": ["S101", "S106"],  # assert, hardcoded secrets in tests
    "scripts/*": ["S101", "T201", "T203"],  # scripts can print
}

[tool.ruff.lint.isort]
known-first-party = ["autoedit"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
enable_error_code = ["arg-type", "attr-defined", "dict-type", "union-attr"]
exclude = [
    "scripts/*",
    "tests/fixtures/*",
    ".venv/*",
    "build/*",
    "dist/*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "gpu: marks tests requiring GPU",
    "api: marks tests requiring API keys",
]

[tool.coverage.run]
source = ["autoedit"]
omit = ["tests/*", "scripts/*", "autoedit/utils/hardware.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.pre-commit]
hooks = [
    {id = "ruff", stages = ["commit", "push"]},
    {id = "ruff-format", stages = ["commit", "push"]},
    {id = "mypy", stages = ["commit", "push"]},
    {id = "pytest", stages = ["push"]},
]